{% load static %}

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}Tienda Django{% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{% static 'store/css/base.css' %}"
    >

    {% block extra_css %}{% endblock %}
</head>

<body>

    <header class="header">

        <div class="container">

            <a
                href="{% url 'store:home' %}"
                class="logo"
            >
                Tienda Django
            </a>

            <nav class="nav">

                <a href="{% url 'store:home' %}">
                    Inicio
                </a>

                <a href="{% url 'store:products' %}">
                    Productos
                </a>

            </nav>

        </div>

    </header>


    <main>

        {% block content %}
        {% endblock %}

    </main>


    <footer class="footer">

        <div class="container">

            <p>
                &copy; 2026 Tienda Django
            </p>

        </div>

    </footer>


    <script src="{% static 'store/js/main.js' %}"></script>

</body>

</html>
